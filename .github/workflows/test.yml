name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format)
        # Formatting is not negotiable in review: hand-wrapping a long line to
        # satisfy E501 is what produced the QSS brace bug fixed in ff7e243.
        run: ruff format --check .

      - name: Type check (mypy, advisory)
        # Advisory until the Qt-stub union-attr findings are worked through;
        # see the "mypy" note in CONTRIBUTING.md.
        continue-on-error: true
        run: mypy .

      - name: Run tests
        # The coverage floor is a floor, not a target: it exists to stop the UI
        # layer from sliding back to 0% unnoticed.
        run: pytest tests/ -q --cov=. --cov-report=term-missing --cov-fail-under=55
