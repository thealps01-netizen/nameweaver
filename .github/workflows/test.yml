name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy, advisory)
        # Advisory until the Qt-stub union-attr findings are worked through;
        # see the "mypy" note in CONTRIBUTING.md.
        continue-on-error: true
        run: mypy .

      - name: Run tests
        run: pytest tests/ -q
