[project]
name = "nameweaver"
version = "0.1.32"
description = "Right-size LLM models to your hardware — PyQt6 desktop app"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "psutil>=5.9.0",
    "qtawesome>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
# NOTE: pytest.ini wins over this section — it is kept only so editors that read
# pyproject.toml still see the test layout. pytest.ini carries the real config
# (pythonpath = . so the root modules import from tests/).

[tool.coverage.run]
# The report is about the app, not about the tests themselves.
omit = ["tests/*", "tools/*"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
# Bare `mypy` is the blocking CI gate, and it covers the annotation-complete
# core only. The PyQt layer is still noisy (Qt stubs make nearly every
# QApplication.instance() a union-attr), so it is checked by `mypy .` and stays
# advisory in CI. Add a module here once it reaches zero under `mypy .`.
files = [
    "cfg.py",
    "downloader.py",
    "hf_api.py",
    "hw.py",
    "models.py",
    "provider_control.py",
    "providers.py",
    "runner.py",
    "scoring.py",
    "themes.py",
    "version.py",
]

# These ship no type information; no change on our side can silence that. The
# core-only run reports them as an unused section — qtawesome and pygments are
# imported by the PyQt layer, which only `mypy .` reaches.
[[tool.mypy.overrides]]
module = ["psutil", "qtawesome", "pygments", "pygments.*"]
ignore_missing_imports = true
